<div class="main-shell">
  <aside class="sidebar">
    <div class="app-brand">
      <img
        class="app-brand-icon"
        src="assets/brand/docklet.png"
        alt=""
        aria-hidden="true"
        draggable="false"
      />
      <div class="app-brand-copy">
        <strong>Docklet</strong>
        <span>Local services</span>
      </div>
    </div>

    <nav class="main-nav" aria-label="Docklet sections">
      <button
        type="button"
        class="nav-button"
        [class.is-active]="store.mainPage() === 'services'"
        [attr.aria-current]="store.mainPage() === 'services' ? 'page' : null"
        (click)="navigate('services')"
      >
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <rect x="3.2" y="3.2" width="5.3" height="5.3" rx="1.4" />
          <rect x="11.5" y="3.2" width="5.3" height="5.3" rx="1.4" />
          <rect x="3.2" y="11.5" width="5.3" height="5.3" rx="1.4" />
          <rect x="11.5" y="11.5" width="5.3" height="5.3" rx="1.4" />
        </svg>
        <span>Services</span>
      </button>
      <button
        type="button"
        class="nav-button"
        [class.is-active]="store.mainPage() === 'settings'"
        [attr.aria-current]="store.mainPage() === 'settings' ? 'page' : null"
        (click)="navigate('settings')"
      >
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <circle cx="10" cy="10" r="2.5" />
          <path
            d="M16 11.8l1.1.8-1.5 2.7-1.3-.5a6.4 6.4 0 01-1.6.9l-.2 1.4H9.4l-.2-1.4a6.4 6.4 0 01-1.6-.9l-1.3.5-1.5-2.7 1.1-.8a6.5 6.5 0 010-1.8l-1.1-.8 1.5-2.7 1.3.5a6.4 6.4 0 011.6-.9l.2-1.4h3.1l.2 1.4a6.4 6.4 0 011.6.9l1.3-.5 1.5 2.7-1.1.8a6.5 6.5 0 010 1.8z"
          />
        </svg>
        <span>Settings</span>
      </button>
    </nav>

    <div class="sidebar-note">
      <span class="engine-state" [class.is-online]="store.dockerAvailable()">
        <span class="engine-dot" aria-hidden="true"></span>
        <span>{{ store.dockerAvailable() ? "Docker ready" : "Docker offline" }}</span>
      </span>
      <span>{{ store.runningCount() }} of {{ store.services().length }} running</span>
    </div>

    <p class="tray-note">Close this window to keep Docklet in the tray.</p>
  </aside>

  <main class="workspace">
    @if (store.mainPage() === "settings") {
      <app-settings-page />
    } @else {
      <app-services-page />
    }
  </main>

  <app-toast />
</div>
